name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/deploy-pages.yml"]
  # 저장소 Settings > Pages에서 Source를 "GitHub Actions"로 켠 뒤에는
  # Actions 탭에서 이 워크플로를 수동으로도 실행할 수 있다 (아직 main에 병합되지 않았을 때 확인용).
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build
        working-directory: game
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
